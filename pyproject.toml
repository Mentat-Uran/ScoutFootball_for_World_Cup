[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scoutfootball"
version = "1.0.3"
description = "ScoutFootball for World Cup — local-first football analytics platform for the 2026 FIFA World Cup."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2.0",
  "fastapi>=0.115,<1.0",
  "lxml>=5.3,<6.0",
  "matplotlib>=3.8,<4.0",
  "mplsoccer>=1.4,<2.0",
  "pandas>=2.3,<3.0",
  "plotly>=6.0,<7.0",
  "pydantic>=2.11,<3.0",
  "scikit-learn>=1.6,<2.0",
  "scipy>=1.13,<2.0",
  "streamlit>=1.45,<2.0",
  "uvicorn>=0.34,<1.0",
]

[project.scripts]
scoutfootball = "scoutfootball.__main__:main"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "py>=1.11.0",
  "pyinstaller>=6.20.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore:Mean of empty slice:RuntimeWarning",
    "ignore:.*set_tight_layout.*:PendingDeprecationWarning",
    "ignore:lbfgs failed to converge:sklearn.exceptions.ConvergenceWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/scoutfootball/app/pages/*" = ["N999"]
"src/scoutfootball/worldcup/data.py" = ["E501"]
