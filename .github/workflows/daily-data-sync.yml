name: Daily data sync

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated data sources to ingest"
        required: false
        default: "football_data,clubelo"
      run_full_pipeline:
        description: "Run build-features and train after ingest"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-data-sync
  cancel-in-progress: false

# Explicit Bash enables pipefail so uv failures propagate through tee.
defaults:
  run:
    shell: bash

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull Git LFS objects (best-effort)
        continue-on-error: true
        run: git lfs pull 2>&1 || echo "LFS pull skipped — continuing without LFS data"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run data ingestion
        env:
          MPLBACKEND: Agg
          PYTHONPATH: src
          SOCCERDATA_DIR: ./data/soccerdata
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          SOURCES="${{ github.event.inputs.sources || 'football_data,clubelo' }}"
          echo "Ingesting sources: $SOURCES"
          uv run python -m scoutfootball ingest --sources $SOURCES 2>&1 | tee ingest.log

      - name: Run build-features (optional)
        if: github.event.inputs.run_full_pipeline == 'true'
        env:
          MPLBACKEND: Agg
          PYTHONPATH: src
        run: uv run python -m scoutfootball build-features 2>&1 | tee build-features.log

      - name: Run train (optional)
        if: github.event.inputs.run_full_pipeline == 'true'
        env:
          MPLBACKEND: Agg
          PYTHONPATH: src
        run: uv run python -m scoutfootball train 2>&1 | tee train.log

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ || true
          git status --short
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: daily sync $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily data sync failed — ${new Date().toISOString().slice(0,10)}`,
              body: `The scheduled data ingestion workflow failed.\n\n[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['automation', 'data-sync']
            })
