name: Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub release after build'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      release_tag:
        description: 'Upload assets to an existing release tag (e.g. v1.0.3). If empty, a new timestamped tag is created.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Generate version tag
        id: version
        shell: bash
        run: |
          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            VERSION="$INPUT_TAG"
          else
            VERSION="v$(date -u +%Y%m%d.%H%M%S)-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

      - name: Generate GHCR image name
        id: image
        shell: bash
        run: |
          REPO="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$REPO" >> "$GITHUB_OUTPUT"
          echo "Generated image: ghcr.io/$REPO"

  release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            build_cmd: powershell -File scripts/build-desktop-windows.ps1
          - os: macos-latest
            build_cmd: bash scripts/build-desktop.sh --mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      - name: Run data pipeline
        continue-on-error: true
        shell: bash
        run: |
          uv run python -m scoutfootball ingest || true
          uv run python -m scoutfootball build-features || true
          uv run python -m scoutfootball train || true

      - name: Ensure data directories exist for packaging
        shell: bash
        run: |
          # electron-builder extraResources requires these directories to exist
          mkdir -p data/gold/feature_store
          mkdir -p data/models
          mkdir -p data/reports
          mkdir -p data/raw/statsbomb_open
          # Create placeholder files so the directories aren't empty (needed for some packagers)
          touch data/gold/feature_store/.gitkeep
          touch data/models/.gitkeep
          touch data/reports/.gitkeep
          touch data/raw/statsbomb_open/.gitkeep
          # Create duckdb placeholder if not exists (use uv run to ensure duckdb is available)
          if [ ! -f data/gold/scoutlab.duckdb ]; then
            uv run python -c "import duckdb; duckdb.connect('data/gold/scoutlab.duckdb').close(); print('Created empty scoutlab.duckdb')" 2>/dev/null || touch data/gold/scoutlab.duckdb
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        run: cd desktop && npm install

      - name: Build desktop app
        run: ${{ matrix.build_cmd }}
        env:
          # Skip macOS code signing in CI (no certificate available)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          retention-days: 7

  docker:
    needs: version
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event.inputs.create_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event.inputs.create_release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.version.outputs.image }}:${{ needs.version.outputs.tag }}
            ${{ needs.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker archive
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: scoutfootball:${{ needs.version.outputs.tag }}
          outputs: type=docker,dest=/tmp/scoutfootball-docker-${{ needs.version.outputs.tag }}-linux-amd64.tar
          cache-from: type=gha

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-linux-amd64
          path: /tmp/scoutfootball-docker-${{ needs.version.outputs.tag }}-linux-amd64.tar
          retention-days: 7

  create-release:
    needs: [version, release, docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true

      - name: Download Docker artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-linux-amd64
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          body: |
            ## ScoutFootball ${{ needs.version.outputs.tag }}

            Automated release from main branch merge.

            ### Changes
            - Commit: ${{ github.sha }}
            - Triggered by: ${{ github.actor }}

            ### Assets
            - Windows: `.exe` installer
            - macOS: `.dmg` disk image
            - Docker: `docker load` archive plus GHCR image

            ### Docker Image
            `${{ needs.version.outputs.image }}:${{ needs.version.outputs.tag }}`
            `${{ needs.version.outputs.image }}:latest`
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.blockmap
            artifacts/**/latest*.yml
            artifacts/**/*.tar
            docs/USER_GUIDE.md
          prerelease: false
          generate_release_notes: ${{ github.event.inputs.release_tag == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
