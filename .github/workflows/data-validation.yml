name: Data validation

on:
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: data-validation
  cancel-in-progress: true

# Explicit Bash enables pipefail so validation failures propagate through tee.
defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull Git LFS objects (best-effort)
        continue-on-error: true
        run: git lfs pull 2>&1 || echo "LFS pull skipped — continuing without LFS data"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run scoutfootball validate
        env:
          MPLBACKEND: Agg
          PYTHONPATH: src
        run: |
          uv run python -m scoutfootball validate 2>&1 | tee validation.log
          echo "---"
          echo "Validation complete. Exit code: $?"

      - name: Check key data files
        env:
          PYTHONPATH: src
        run: |
          uv run python3 -c "
          import os, sys

          checks = []
          base = 'data'

          # Expected files and minimum row counts
          expected = {
              'raw/football_data/combined_results.parquet': 50000,
              'raw/understat/players_10seasons.parquet': 25000,
              'gold/feature_store/player_ratings_optimized.parquet': 20000,
              'gold/feature_store/rating_feature_matrix.parquet': 5000,
          }

          for path, min_rows in expected.items():
              full = os.path.join(base, path)
              if not os.path.exists(full):
                  checks.append(f'MISSING: {path}')
                  continue
              try:
                  import pandas as pd
                  df = pd.read_parquet(full)
                  rows = len(df)
                  if rows < min_rows:
                      checks.append(f'LOW ROWS: {path} has {rows} rows (min {min_rows})')
                  else:
                      checks.append(f'OK: {path} has {rows} rows')
              except Exception as e:
                  checks.append(f'ERROR: {path} — {e}')

          print('\n'.join(checks))
          failures = [c for c in checks if not c.startswith('OK')]
          if failures:
              print(f'\n{len(failures)} check(s) failed!')
              sys.exit(1)
          else:
              print('\nAll checks passed.')
          "

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // Avoid duplicate open issues
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-validation',
              per_page: 1
            });
            if (existing.data.length > 0) {
              console.log('Open data-validation issue already exists, skipping.');
              return;
            }

            const date = new Date().toISOString().slice(0, 10);
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Data validation failed — ${date}`,
              body: `The scheduled data validation check failed.\n\n[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['automation', 'data-validation']
            });

      - name: Close issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-validation'
            });
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Validation passed at ${new Date().toISOString().slice(0, 19)} UTC. Closing.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
